apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: open-webui-data
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi  # 申请 2Gi 存储

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: open-webui
  template:
    metadata:
      labels:
        app: open-webui
    spec:
      containers:
      - name: open-webui
        image: ghcr.io/open-webui/open-webui:main
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: data
          mountPath: /app/backend/data  # 挂载数据目录
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: open-webui-data  # 关联 PVC

---
apiVersion: v1
kind: Service
metadata:
  name: open-webui
spec:
  type: NodePort  # 启用 NodePort 暴露服务到集群外
  selector:
    app: open-webui
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30002  # 外部访问端口 30002
