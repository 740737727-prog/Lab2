apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm
  template:
    metadata:
      labels:
        app: vllm
    spec:
      hostNetwork: true  # 启用主机网络，降低 GPU 内存访问延迟
      containers:
      - name: vllm
        image: ghcr.io/nvidia-ai-iot/vllm:latest-jetson-orin
        command:
        - vllm
        - serve
        - /root/.cache/huggingface/Qwen3-4B-quantized.w4a16
        - --gpu-memory-utilization
        - "0.25"
        - --max-model-len
        - "1024"
        - --max-num-batched-tokens
        - "2048"
        resources:
          limits:
            nvidia.com/gpu: 1  # 申请 1 块 GPU
        volumeMounts:
        - name: model
          mountPath: /root/.cache/huggingface/Qwen3-4B-quantized.w4a16
        - name: shm
          mountPath: /dev/shm  # 挂载共享内存目录
      volumes:
      - name: model
        hostPath:
          path: /opt/models/Qwen3-4B-quantized.w4a16  # 主机上的模型目录
      - name: shm
        emptyDir:
          medium: Memory  # 使用内存作为介质
          sizeLimit: 8Gi   # 共享内存大小限制为 8Gi
